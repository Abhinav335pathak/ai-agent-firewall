name: Android app CI

on:
  push:
    branches: [main]
    paths: ['app/**', 'firewall-proxy/**', 'policy/**', '.github/workflows/android-app.yml']
  pull_request:
    paths: ['app/**', 'firewall-proxy/**', 'policy/**', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test and build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --concurrency=1
      - name: Install real gateway dependencies
        working-directory: firewall-proxy
        run: npm ci
      - name: Exercise the Dart client against a disposable real firewall
        run: |
          node tool/qa-server.js > "$RUNNER_TEMP/mobile-qa.log" 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid"; wait "$qa_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/health >/dev/null; then break; fi
            sleep 1
          done
          flutter test test/live_gateway_test.dart --dart-define=FIREWALL_TEST_SERVER=http://127.0.0.1:3300
      - name: Build demo APK (debug signed)
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: agent-firewall-demo-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: app-test-coverage
          path: app/coverage/lcov.info

  android-ui:
    name: Android emulator approval flow
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.9'
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix firewall-proxy
      - run: cd app && flutter pub get --enforce-lockfile
      - name: Enable KVM access for the disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start disposable mobile QA backend
        env:
          MOBILE_QA_APPROVAL_TIMEOUT_MS: '30000'
        run: |
          node app/tool/qa-server.js > "$RUNNER_TEMP/mobile-qa.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/mobile-qa.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3300/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/mobile-qa.log"
          exit 1
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd app && flutter test integration_test/operator_flow_test.dart -d emulator-5554 --dart-define=FIREWALL_TEST_SERVER=http://10.0.2.2:3300
      - name: Stop QA backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/mobile-qa.pid" ]; then kill "$(cat "$RUNNER_TEMP/mobile-qa.pid")" || true; fi
