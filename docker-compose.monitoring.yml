# Optional Prometheus + Grafana. Enable with ONE of:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#   or put this in .env:  COMPOSE_FILE=docker-compose.yml:docker-compose.monitoring.yml
#
# Both UIs bind to 127.0.0.1 only. On the server, reach them with an SSH tunnel:
#   ssh -L 3001:localhost:3001 -L 9090:localhost:9090 -i ~/.ssh/firewall-ec2-key ubuntu@<EC2_IP>
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "127.0.0.1:9090:9090"
    networks: [public_net]

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on: [prometheus]
    networks: [public_net]

volumes:
  prometheus_data:
  grafana_data:
