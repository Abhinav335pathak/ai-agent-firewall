global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

scrape_configs:
  - job_name: firewall-proxy
    metrics_path: /metrics
    scrape_interval: 5s
    authorization:
      credentials_file: /tmp/firewall-metrics-token
    static_configs:
      - targets: ["firewall-proxy:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
