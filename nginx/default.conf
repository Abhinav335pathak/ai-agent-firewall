# Edge proxy: one stable endpoint (port 80) for the Android app and the agent.
# Handles plain REST and WebSocket upgrades (Socket.IO).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # Docker's embedded DNS. Using a variable in proxy_pass makes nginx re-resolve
    # the firewall's IP, so a redeploy (new container IP) never causes 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $firewall http://firewall-proxy:3000;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Realtime feed (Android app + dashboard)
    location /socket.io/ {
        proxy_pass $firewall;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else. Agent requests can be held open while waiting for a human.
    location / {
        proxy_pass $firewall;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
