# =============================================================================
#  AI Agent Firewall - policy rulebook  (Policy-as-Code)
# =============================================================================
version: 1

default_decision: REQUIRE_APPROVAL

rules:
  - action: read_logs
    risk: LOW
    decision: ALLOW
    description: Read-only access to server logs.

  - action: spin_up_dev_vm
    risk: MEDIUM
    decision: REQUIRE_APPROVAL
    description: Creates a billable dev server.

  - action: change_iam_permissions
    risk: HIGH
    decision: REQUIRE_APPROVAL
    description: Elevates permissions of an identity.

  - action: delete_prod_db
    risk: CRITICAL
    decision: BLOCK
    description: Destroys production customer data. Never allowed.

  - action: sql_read
    risk: LOW
    decision: ALLOW
    description: Read-only SELECT SQL queries generated by an AI agent.

  - action: sql_write
    risk: HIGH
    decision: REQUIRE_APPROVAL
    description: State-changing INSERT/UPDATE SQL queries require human sign-off.

  - action: sql_destructive
    risk: CRITICAL
    decision: BLOCK
    description: Destructive or multi-statement SQL (DROP, TRUNCATE, DELETE, ALTER). Never allowed.